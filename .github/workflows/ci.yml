name: CI

on:
  push:
  pull_request:

jobs:
  secret-scan:
    name: secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history, so every commit is scanned)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for committed secrets
        run: >-
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.28.0
          git /repo --redact --verbose

  quality-gate:
    name: quality-gate (${{ matrix.workspace }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        workspace: [apps/web, apps/api]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build --workspace ${{ matrix.workspace }}

      - name: Lint
        run: npm run lint --workspace ${{ matrix.workspace }}

      - name: Check formatting
        run: npm run format:check --workspace ${{ matrix.workspace }}

      - name: Test
        run: npm run test --workspace ${{ matrix.workspace }} --if-present

  docker:
    name: docker compose smoke test
    runs-on: ubuntu-latest
    needs: quality-gate
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and start the stack
        run: docker compose up --build --detach --wait

      - name: Check the API health endpoint
        run: curl --fail --silent --show-error --include http://localhost:3000/health

      - name: Check the API readiness endpoint (database)
        run: curl --fail --silent --show-error --include http://localhost:3000/health/ready

      - name: Check the web app
        run: curl --fail --silent --show-error --output /dev/null http://localhost:8080/

      - name: Show logs
        if: always()
        run: docker compose logs

      - name: Stop the stack
        if: always()
        run: docker compose down
