server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # Same-origin API: the browser calls /api on this host and nginx forwards it
  # to the api service, just like the Vite proxy does in development.
  location /api/ {
    proxy_pass http://api:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Hashed file names never change content, so they can be cached forever.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # SPA fallback: deep links such as /bears/ursus-arctos must return
  # index.html so the client-side router can handle them.
  location / {
    add_header Cache-Control "no-cache";
    # Second line of defence against XSS: even if markup got injected, the
    # browser runs only our own scripts and talks only to our own origin.
    # Inline styles and Google Fonts are used by index.html; images come from
    # Wikimedia.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: https://upload.wikimedia.org https://thumb.wikimedia.org; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options nosniff always;
    try_files $uri $uri/ /index.html;
  }
}
