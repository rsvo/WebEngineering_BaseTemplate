services:
  db:
    image: postgres:18-alpine
    # Local-development credentials, not secrets; override via a .env file.
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bears}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bears}
      POSTGRES_DB: ${POSTGRES_DB:-bears}
    # Only reachable from this machine (for `npm run dev`), not the network.
    ports:
      - '127.0.0.1:${DB_PORT:-5432}:5432'
    # Postgres 18+ keeps its data in a versioned subdirectory of this path.
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # One-shot: brings the schema up to date and (re)seeds the bears, then exits.
  # The API only starts once this has succeeded.
  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ['sh', '-c', 'node dist/db/migrate.js && node dist/db/seed.js']
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:-bears}:${POSTGRES_PASSWORD:-bears}@db:5432/${POSTGRES_DB:-bears}
      # Set e.g. WIKIPEDIA_API_URL=https://en.wikipedia.invalid/w/api.php to
      # block Wikipedia; the seed then falls back to apps/api/fixtures.
      WIKIPEDIA_API_URL: ${WIKIPEDIA_API_URL:-}
      UPSTREAM_TIMEOUT_MS: ${UPSTREAM_TIMEOUT_MS:-}
      # The seeded moderator. The default is for local use only; set your own
      # MODERATOR_PASSWORD (e.g. in a git-ignored .env) anywhere else.
      MODERATOR_EMAIL: ${MODERATOR_EMAIL:-moderator@example.org}
      MODERATOR_PASSWORD: ${MODERATOR_PASSWORD:-local-moderator-password}
    depends_on:
      db:
        condition: service_healthy
    restart: 'no'

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgres://${POSTGRES_USER:-bears}:${POSTGRES_PASSWORD:-bears}@db:5432/${POSTGRES_DB:-bears}
      DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-}
      # Off in production; ENABLE_DEBUG_ROUTES=true adds GET /api/debug/error
      # to provoke a 500 and show that it leaks nothing.
      ENABLE_DEBUG_ROUTES: ${ENABLE_DEBUG_ROUTES:-}
      # Session cookies are Secure in production. Browsers accept that on
      # http://localhost; set COOKIE_SECURE=false for plain HTTP elsewhere.
      COOKIE_SECURE: ${COOKIE_SECURE:-}
      # Comma-separated origins allowed to call the API cross-origin, e.g.
      # CORS_ORIGINS=http://localhost:4173. Empty: none; the web app below
      # reaches the API through nginx on its own origin and needs no CORS.
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      # nginx (web) forwards the client IP in X-Forwarded-For; it is only
      # believed from private networks such as the compose network.
      TRUST_PROXY: ${TRUST_PROXY:-uniquelocal}
      # Login/register attempts per client IP and minute (default 5).
      AUTH_RATE_LIMIT_MAX: ${AUTH_RATE_LIMIT_MAX:-}
      # REPORT_MODE=naive brings back the lost-update race of
      # POST /api/comments/:id/report (see `npm run race:reports`).
      REPORT_MODE: ${REPORT_MODE:-}
    ports:
      - '${API_PORT:-3000}:3000'
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    # Docker calls the liveness check /health, which does not depend on the
    # database: a database outage must not get the API restarted. `web` only
    # starts once the API reports healthy.
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3000/health']
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - '${WEB_PORT:-8080}:80'
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  db-data:
