services:
  db:
    image: postgres:18-alpine
    # Local-development credentials, not secrets; override via a .env file.
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bears}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bears}
      POSTGRES_DB: ${POSTGRES_DB:-bears}
    # Only reachable from this machine (for `npm run dev`), not the network.
    ports:
      - '127.0.0.1:${DB_PORT:-5432}:5432'
    # Postgres 18+ keeps its data in a versioned subdirectory of this path.
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgres://${POSTGRES_USER:-bears}:${POSTGRES_PASSWORD:-bears}@db:5432/${POSTGRES_DB:-bears}
      DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-}
      # Empty means "use the default"; set e.g.
      # WIKIPEDIA_API_URL=https://en.wikipedia.invalid/w/api.php to block the
      # upstream and see the 502 error state.
      WIKIPEDIA_API_URL: ${WIKIPEDIA_API_URL:-}
      UPSTREAM_TIMEOUT_MS: ${UPSTREAM_TIMEOUT_MS:-}
      # Off in production; ENABLE_DEBUG_ROUTES=true adds GET /api/debug/error
      # to provoke a 500 and show that it leaks nothing.
      ENABLE_DEBUG_ROUTES: ${ENABLE_DEBUG_ROUTES:-}
      # Comma-separated origins allowed to call the API cross-origin, e.g.
      # CORS_ORIGINS=http://localhost:4173. Empty: none; the web app below
      # reaches the API through nginx on its own origin and needs no CORS.
      CORS_ORIGINS: ${CORS_ORIGINS:-}
    ports:
      - '${API_PORT:-3000}:3000'
    depends_on:
      db:
        condition: service_healthy
    # Docker calls the liveness check /health, which does not depend on the
    # database: a database outage must not get the API restarted. `web` only
    # starts once the API reports healthy.
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3000/health']
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - '${WEB_PORT:-8080}:80'
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  db-data:
