services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      NODE_ENV: production
      PORT: 3000
      # Empty means "use the default"; set e.g.
      # WIKIPEDIA_API_URL=https://en.wikipedia.invalid/w/api.php to block the
      # upstream and see the 502 error state.
      WIKIPEDIA_API_URL: ${WIKIPEDIA_API_URL:-}
      UPSTREAM_TIMEOUT_MS: ${UPSTREAM_TIMEOUT_MS:-}
      # Off in production; ENABLE_DEBUG_ROUTES=true adds GET /api/debug/error
      # to provoke a 500 and show that it leaks nothing.
      ENABLE_DEBUG_ROUTES: ${ENABLE_DEBUG_ROUTES:-}
      # Comma-separated origins allowed to call the API cross-origin, e.g.
      # CORS_ORIGINS=http://localhost:4173. Empty: none; the web app below
      # reaches the API through nginx on its own origin and needs no CORS.
      CORS_ORIGINS: ${CORS_ORIGINS:-}
    ports:
      - '${API_PORT:-3000}:3000'
    # Docker itself calls /health and marks the container (un)healthy; `web`
    # only starts once the API reports healthy.
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3000/health']
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - '${WEB_PORT:-8080}:80'
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
