root: true

# Shared rules for every workspace. apps/web and apps/api add their own
# environment (browser + React vs. Node) in their own .eslintrc.yml.
parserOptions:
  # Use the tsconfig.json closest to each linted file, so the same config works
  # from the workspace directories and from lint-staged at the repository root.
  project: true
  sourceType: module
  ecmaVersion: latest

extends:
  - standard-with-typescript
  - plugin:@typescript-eslint/recommended
  - plugin:prettier/recommended
  - prettier

ignorePatterns:
  - dist
  - node_modules
  - '*.config.js'
  - '*.config.ts'
